# Every folder that holds a workspace package.
packages:
  - apps/*
  - packages/*
  - tests/*

# One version of each shared tool for the whole repo.
# Packages ask for it with "catalog:" instead of a version range.
catalog:
  "@eslint/js": 10.0.1
  "@hono/node-server": 2.1.11
  "@playwright/test": 1.65.1
  "@types/node": 26.6.11
  eslint: 10.15.0
  eslint-config-prettier: 10.1.8
  fast-check: 4.11.0
  globals: 17.14.0
  hono: 4.13.22
  prettier: 3.10.1
  turbo: 2.11.13
  typescript: 6.0.3
  typescript-eslint: 8.74.0
  zod: 4.6.7
  vitest: 5.1.2

# Fail the install if the Node version does not match "engines".
engineStrict: true

# Supply-chain guard: never install a version published less than
# 1 day (1440 minutes) ago. Most malicious releases are caught within hours.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

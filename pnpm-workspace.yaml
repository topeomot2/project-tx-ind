# Every folder that holds a workspace package.
packages:
  - apps/*
  - packages/*
  - tests/*

# One version of each shared tool for the whole repo.
# Packages ask for it with "catalog:" instead of a version range.
catalog:
  "@eslint/js": 10.0.1
  "@hono/node-server": 2.1.11
  "@playwright/test": 1.65.1
  "@stryker-mutator/api": 10.1.1
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  "@types/node": 26.6.11
  "@vitest/eslint-plugin": 1.6.28
  eslint: 10.15.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-playwright: 2.12.2
  fast-check: 4.11.0
  globals: 17.14.0
  postgres: 4.1.1
  hono: 4.13.22
  prettier: 3.10.1
  testcontainers: 12.2.2
  turbo: 2.11.13
  typescript: 6.0.3
  typescript-eslint: 8.74.0
  zod: 4.6.7
  vitest: 5.1.2

# Fail the install if the Node version does not match "engines".
engineStrict: true

# Supply-chain guard: never install a version published less than
# 1 day (1440 minutes) ago. Most malicious releases are caught within hours.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Install scripts are blocked unless listed here. These come with
# Testcontainers (via ssh2) and are optional native speed-ups: not needed.
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false

# Stryker loads TypeScript at runtime without declaring it, which pnpm's
# strict layout does not allow. Declare it so the repo's version is used.
packageExtensions:
  "@stryker-mutator/core":
    peerDependencies:
      typescript: "*"
